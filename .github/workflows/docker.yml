name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: mino
    permissions:
      contents: read
    steps:
      - run: |
          cat /sys/class/net/eth0/mtu
          docker network inspect bridge --format '{{json .Options}}'
          docker run --rm alpine:3.24 sh -c 'cat /sys/class/net/eth0/mtu; wget -q -T 20 -O /dev/null https://github.com && echo bridge-ok || echo bridge-fail'
          docker run --rm --network host alpine:3.24 sh -c 'wget -q -T 20 -O /dev/null https://github.com && echo host-ok || echo host-fail'
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
