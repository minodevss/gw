name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/gw/Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: binary
          outputs: type=local,dest=out
      - name: Package
        run: |
          mkdir dist
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            target=${pair##*:}-unknown-linux-musl
            cp LICENSE README.md "out/linux_$arch/"
            tar -C "out/linux_$arch" -czf "dist/gw-$target.tar.gz" gw LICENSE README.md
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-linux
          path: dist/

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --release --locked --package gw --target aarch64-apple-darwin
      - name: Package
        run: |
          mkdir dist
          cp target/aarch64-apple-darwin/release/gw .
          tar -czf dist/gw-aarch64-apple-darwin.tar.gz gw LICENSE README.md
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-macos
          path: dist/

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum gw-*.tar.gz > SHA256SUMS
      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/gw-*.tar.gz
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
