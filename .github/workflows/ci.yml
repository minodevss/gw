name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [mino, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the C toolchain and rustup if the runner lacks them
        if: runner.os == 'Linux'
        run: |
          command -v cc >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential; }
          command -v rustup >/dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: mino
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the C toolchain and rustup if the runner lacks them
        run: |
          command -v cc >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential; }
          command -v rustup >/dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-deny
      - run: cargo deny check

  actions:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1 && gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
