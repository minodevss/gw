{% extends "admin/frame.html" %}
{% block content %}
<div class="head"><h1>Activity</h1><span class="sub">Every request, newest first</span></div>
<form class="filters" method="get" action="/admin/activity" role="search">
  <label for="q" class="sr">Search requests</label>
  <input id="q" name="q" class="search" value="{{ q }}" placeholder="Search, or account:x key:y model:z status:429" autocomplete="off" spellcheck="false" data-search>
  {% if outcome != "all" %}<input type="hidden" name="outcome" value="{{ outcome }}">{% endif %}
  <button type="submit">Search</button>
  <span class="seg">{% for choice in outcomes %}<a href="/admin/activity{% if !choice.query.is_empty() %}?{{ choice.query }}{% endif %}"{% if choice.current %} aria-current="true"{% endif %}>{{ choice.label }}</a>{% endfor %}</span>
</form>
{{ live|safe }}
{% endblock %}
